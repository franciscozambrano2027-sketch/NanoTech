<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#101923"/><text x="60" y="70" fill="#fff" font-family="Arial" font-size="34" font-weight="700">PS4 / PS5: ruta de diagnóstico</text><g font-family="Arial" font-size="21" text-anchor="middle"><rect x="70" y="140" width="240" height="105" rx="18" fill="#172331" stroke="#45c7b1"/><text x="190" y="180" fill="#fff">1. No enciende</text><text x="190" y="215" fill="#9eabb8">cable + toma + fuente</text><rect x="340" y="140" width="240" height="105" rx="18" fill="#172331" stroke="#45c7b1"/><text x="460" y="180" fill="#fff">2. Enciende</text><text x="460" y="215" fill="#9eabb8">imagen / HDMI</text><rect x="610" y="140" width="240" height="105" rx="18" fill="#172331" stroke="#f0ad45"/><text x="730" y="180" fill="#fff">3. Se apaga</text><text x="730" y="215" fill="#9eabb8">temperatura / PSU</text><rect x="880" y="140" width="240" height="105" rx="18" fill="#172331" stroke="#f0ad45"/><text x="1000" y="180" fill="#fff">4. Error</text><text x="1000" y="215" fill="#9eabb8">SSD / software</text><path d="M310 192h30M580 192h30M850 192h30" stroke="#9eabb8" stroke-width="4"/><rect x="190" y="345" width="820" height="170" rx="20" fill="#0b121a" stroke="#263443"/><text x="600" y="390" fill="#f0ad45" font-size="24">Importante</text><text x="600" y="435" fill="#fff">No atribuyas una falla a un chip sin mediciones.</text><text x="600" y="475" fill="#9eabb8">Síntoma → prueba externa → medición → componente.</text></g></svg>