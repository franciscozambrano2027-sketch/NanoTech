<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#101923"/><text x="60" y="70" fill="#f5f7fa" font-family="Arial" font-size="34" font-weight="700">Diagnóstico: PC / Laptop no enciende</text><g font-family="Arial" font-size="22" text-anchor="middle"><rect x="70" y="150" width="220" height="100" rx="18" fill="#172331" stroke="#45c7b1"/><text x="180" y="190" fill="#fff">1. Alimentación</text><text x="180" y="225" fill="#9eabb8">cargador / fuente</text><rect x="340" y="150" width="220" height="100" rx="18" fill="#172331" stroke="#45c7b1"/><text x="450" y="190" fill="#fff">2. Señales</text><text x="450" y="225" fill="#9eabb8">LED / ventilador</text><rect x="610" y="150" width="220" height="100" rx="18" fill="#172331" stroke="#f0ad45"/><text x="720" y="190" fill="#fff">3. POST</text><text x="720" y="225" fill="#9eabb8">RAM / vídeo</text><rect x="880" y="150" width="220" height="100" rx="18" fill="#172331" stroke="#f0ad45"/><text x="990" y="190" fill="#fff">4. Arranque</text><text x="990" y="225" fill="#9eabb8">SSD / sistema</text><path d="M290 200h50M560 200h50M830 200h50" stroke="#9eabb8" stroke-width="4"/><rect x="190" y="360" width="820" height="150" rx="20" fill="#0b121a" stroke="#263443"/><text x="600" y="405" fill="#45c7b1" font-size="24">Regla de diagnóstico</text><text x="600" y="450" fill="#fff">Una prueba → un resultado → una hipótesis</text><text x="600" y="485" fill="#9eabb8">No cambies varias piezas a la vez.</text></g></svg>