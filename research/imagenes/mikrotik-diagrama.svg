<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#101923"/><text x="60" y="70" fill="#fff" font-family="Arial" font-size="34" font-weight="700">MikroTik: diagnóstico de conectividad</text><g font-family="Arial" font-size="21" text-anchor="middle"><rect x="70" y="150" width="210" height="100" rx="18" fill="#172331" stroke="#45c7b1"/><text x="175" y="190" fill="#fff">1. Link</text><text x="175" y="225" fill="#9eabb8">cable / Wi‑Fi</text><rect x="320" y="150" width="210" height="100" rx="18" fill="#172331" stroke="#45c7b1"/><text x="425" y="190" fill="#fff">2. IP</text><text x="425" y="225" fill="#9eabb8">DHCP / estática</text><rect x="570" y="150" width="210" height="100" rx="18" fill="#172331" stroke="#f0ad45"/><text x="675" y="190" fill="#fff">3. DNS</text><text x="675" y="225" fill="#9eabb8">resolución</text><rect x="820" y="150" width="260" height="100" rx="18" fill="#172331" stroke="#f0ad45"/><text x="950" y="190" fill="#fff">4. Ruta / NAT</text><text x="950" y="225" fill="#9eabb8">salida a Internet</text><path d="M280 200h40M530 200h40M780 200h40" stroke="#9eabb8" stroke-width="4"/><rect x="180" y="350" width="840" height="150" rx="20" fill="#0b121a" stroke="#263443"/><text x="600" y="395" fill="#45c7b1" font-size="24">Orden recomendado</text><text x="600" y="440" fill="#fff">gateway → IP pública → dominio</text><text x="600" y="475" fill="#9eabb8">Así separas red local, Internet y DNS.</text></g></svg>