name: Generar borradores diarios

on:
  schedule:
    # 13:00 UTC = 08:00 en Ecuador (UTC-5)
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: generar-borradores-diarios
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r automation/requirements.txt

      - name: Verificar fuentes RSS
        run: |
          python - <<'PY'
          import json, requests
          from pathlib import Path
          cfg=json.loads(Path("automation/config/feeds.json").read_text(encoding="utf-8"))
          ok=0
          for f in cfg.get("fuentes", []):
              try:
                  r=requests.get(f["url"], timeout=20, headers={"User-Agent":"Mozilla/5.0 NucleoTech-RSS/2.0"})
                  r.raise_for_status()
                  print(f"OK {f['nombre']}: HTTP {r.status_code}, {len(r.content)} bytes")
                  ok += 1
              except Exception as e:
                  print(f"ERROR {f['nombre']}: {e}")
          if ok == 0:
              raise SystemExit("Todas las fuentes RSS fallaron; no se continuará como si no hubiera noticias.")
          PY

      - name: Instalar Ollama
        run: |
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi

      - name: Comprobar/Iniciar Ollama
        run: |
          if ! curl -sf http://127.0.0.1:11434 >/dev/null; then
            nohup ollama serve > ollama.log 2>&1 &
            for i in $(seq 1 30); do
              curl -sf http://127.0.0.1:11434 >/dev/null && break
              sleep 2
            done
          fi
          curl -sf http://127.0.0.1:11434 >/dev/null

      - name: Descargar modelo
        env:
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'llama3.2:3b' }}
        run: ollama pull "$OLLAMA_MODEL"

      - name: Generar borradores
        env:
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'llama3.2:3b' }}
          NUM_NOTICIAS: ${{ vars.NUM_NOTICIAS || '2' }}
          GENERAR_GUIA: ${{ vars.GENERAR_GUIA || '1' }}
          MODO_BORRADOR: "1"
        run: python automation/generate_content.py

      - name: Validar rutas de imágenes
        run: python scripts/validate/validate_assets.py

      - name: Commit de borradores
        run: |
          git config user.name "nucleotech-bot"
          git config user.email "actions@users.noreply.github.com"
          git add automation/drafts automation/estado/estado.json ollama.log || true
          if git diff --cached --quiet; then
            echo "Sin borradores nuevos."
          else
            git commit -m "Borradores editoriales: $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Crear aviso de revisión
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s /tmp/nucleotech_resumen.md ]; then
            gh issue create               --title "Borradores para revisar $(date -u +'%Y-%m-%d')"               --body-file /tmp/nucleotech_resumen.md || true
          fi
