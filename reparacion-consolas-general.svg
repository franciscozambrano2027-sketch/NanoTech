<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#101923"/><text x="60" y="70" fill="#fff" font-family="Arial" font-size="34" font-weight="700">Antes de abrir una consola</text><g font-family="Arial" font-size="21" text-anchor="middle"><rect x="100" y="150" width="300" height="115" rx="18" fill="#172331" stroke="#45c7b1"/><text x="250" y="195" fill="#fff">1. Documenta síntomas</text><text x="250" y="230" fill="#9eabb8">vídeo / códigos / cuándo falla</text><rect x="450" y="150" width="300" height="115" rx="18" fill="#172331" stroke="#45c7b1"/><text x="600" y="195" fill="#fff">2. Prueba lo externo</text><text x="600" y="230" fill="#9eabb8">cables / pantalla / alimentación</text><rect x="800" y="150" width="300" height="115" rx="18" fill="#172331" stroke="#f0ad45"/><text x="950" y="195" fill="#fff">3. Mide antes de cambiar</text><text x="950" y="230" fill="#9eabb8">evita reemplazos por intuición</text><path d="M400 208h50M750 208h50" stroke="#9eabb8" stroke-width="4"/></g></svg>